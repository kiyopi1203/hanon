<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanon Scale &amp; Chord Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .apple-key-white {
            background-color: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 0 0 6px 6px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.04);
        }
        .apple-key-black {
            background-color: #1d1d1f;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .key-active {
            background: linear-gradient(135deg, #0071e3, #409cff) !important;
            border-color: #0071e3 !important;
            box-shadow: 0 0 12px rgba(0, 113, 227, 0.4) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <!-- Apple風トップナビゲーション -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 border-b border-gray-200/60">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="music" class="w-4 h-4"></i>
                </div>
                <div>
                    <h1 class="text-sm font-semibold tracking-tight text-gray-900">Hanon Notes</h1>
                    <p class="text-[11px] text-gray-500">全24調 1オクターブ構成音ビジュアライザー</p>
                </div>
            </div>
            <button id="btn-audio-init" class="bg-gray-900 hover:bg-black text-white text-xs font-medium px-4 py-2 rounded-full transition shadow-sm cursor-pointer flex items-center gap-1.5">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> 音声を有効にする
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">

        <!-- ヒーロー・プレイヤーカード -->
        <section class="glass-panel rounded-3xl p-6 sm:p-8 shadow-sm border border-gray-200/60 space-y-6">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span id="scale-type-tag" class="text-[11px] font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Major Scale</span>
                    <h2 id="active-title" class="text-2xl font-bold tracking-tight text-gray-900 mt-2">ハ長調 (C Major)</h2>
                </div>

                <div class="flex items-center gap-2">
                    <button id="btn-play" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-5 py-2.5 rounded-full transition shadow-sm flex items-center gap-2 cursor-pointer">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> 試聴する
                    </button>
                    <button id="btn-stop" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-medium px-4 py-2.5 rounded-full transition hidden flex items-center gap-2 cursor-pointer">
                        <i data-lucide="square" class="w-3.5 h-3.5 fill-current"></i> 停止
                    </button>
                </div>
            </div>

            <!-- 1オクターブ鍵盤コンテナ (C4 〜 C5) -->
            <div class="pt-4 pb-2">
                <div class="text-[11px] font-medium text-gray-400 mb-2 uppercase tracking-wider">1オクターブ構成音 (C4 - C5)</div>
                <div class="overflow-x-auto pb-2">
                    <div id="keyboard-container" class="relative inline-flex h-40 bg-gray-100 p-2 rounded-2xl shadow-inner min-w-[500px]">
                        <!-- 鍵盤がここに描画されます -->
                    </div>
                </div>
            </div>

        </section>

        <!-- 全24調 リストグリッド -->
        <section class="space-y-3">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-1">すべての調を選択・再生</h3>
            <div id="scale-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <!-- 調カードが自動生成されます -->
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="text-center py-8 text-xs text-gray-400 border-t border-gray-200/40">
        Minimalist Hanon Visualizer ｜ Designed for Focus &amp; Clarity
    </footer>

    <!-- スクリプト部 -->
    <script>
        lucide.createIcons();

        // 全24調データ（1オクターブ分の構成音：長調 ＆ 和声短音階）
        const scalesData = [
            // 長調 (Major)
            { id: "C", name: "ハ長調 (C Major)", root: 60, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "G", name: "ト長調 (G Major)", root: 67, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "D", name: "ニ長調 (D Major)", root: 62, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "A", name: "イ長調 (A Major)", root: 69, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "E", name: "ホ長調 (E Major)", root: 64, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "B", name: "ロ長調 (B Major)", root: 71, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "F#", name: "嬰ヘ長調 (F# Major)", root: 66, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "Db", name: "変ニ長調 (Db Major)", root: 61, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "Ab", name: "変イ長調 (Ab Major)", root: 68, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "Eb", name: "変ホ長調 (Eb Major)", root: 63, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "Bb", name: "変ロ長調 (Bb Major)", root: 70, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },
            { id: "F", name: "ヘ長調 (F Major)", root: 65, type: "major", offsets: [0, 2, 4, 5, 7, 9, 11, 12] },

            // 和声短音階 (Harmonic Minor)
            { id: "Am", name: "イ短調 (A Minor)", root: 69, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Em", name: "ホ短調 (E Minor)", root: 64, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Bm", name: "ロ短調 (B Minor)", root: 71, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "F#m", name: "嬰ヘ短調 (F# Minor)", root: 66, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "C#m", name: "嬰ハ短調 (C# Minor)", root: 61, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "G#m", name: "嬰ト短調 (G# Minor)", root: 68, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Dbm", name: "嬰ハ短調(Dbm)", root: 61, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] }, // alt ref
            { id: "Ebm", name: "嬰ト短調等", root: 63, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Bbm", name: "変ロ短調 (Bb Minor)", root: 70, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Fm", name: "ヘ短調 (F Minor)", root: 65, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Cm", name: "ハ短調 (C Minor)", root: 60, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Gm", name: "ト短調 (G Minor)", root: 67, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] },
            { id: "Dm", name: "ニ短調 (D Minor)", root: 62, type: "harmonic_minor", offsets: [0, 2, 3, 5, 7, 8, 11, 12] }
        ];

        let currentScaleId = "C";
        let audioCtx = null;
        let isPlaying = false;
        let playTimeoutId = null;

        const activeTitle = document.getElementById('active-title');
        const scaleTypeTag = document.getElementById('scale-type-tag');
        const keyboardContainer = document.getElementById('keyboard-container');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const btnAudioInit = document.getElementById('btn-audio-init');
        const scaleGrid = document.getElementById('scale-grid');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            btnAudioInit.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-blue-600"><i> 準備完了';
            btnAudioInit.className = "bg-white border border-gray-200 text-gray-800 text-xs font-medium px-4 py-2 rounded-full transition shadow-sm cursor-pointer flex items-center gap-1.5";
            lucide.createIcons();
        }

        btnAudioInit.addEventListener('click', initAudio);

        function playTone(midiNote) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        // 1オクターブ鍵盤描画 (C4 = 60 から C5 = 72)
        function renderKeyboard(activeMidi = -1) {
            keyboardContainer.innerHTML = '';
            const scaleObj = scalesData.find(s => s.id === currentScaleId);
            const activeNotes = scaleObj.offsets.map(offset => scaleObj.root + offset);

            const startMidi = 60; // C4
            const endMidi = 72;   // C5
            const whiteKeyWidth = 52;
            let whiteIndex = 0;

            // 白鍵の総数カウント
            for (let m = startMidi; m <= endMidi; m++) {
                if (![1, 3, 6, 8, 10].includes(m % 12)) whiteIndex++;
            }
            keyboardContainer.style.width = `${whiteIndex * whiteKeyWidth}px`;

            // 白鍵描画
            whiteIndex = 0;
            for (let m = startMidi; m <= endMidi; m++) {
                const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
                if (!isBlack) {
                    const isInScale = activeNotes.includes(m);
                    const isActivePlay = (activeMidi === m);

                    const key = document.createElement('div');
                    key.className = `absolute top-0 bottom-0 apple-key-white cursor-pointer transition-all duration-150 flex flex-col justify-end items-center pb-3 ${isActivePlay ? 'key-active' : isInScale ? 'bg-blue-50/80 border-blue-300' : ''}`;
                    key.style.left = `${whiteIndex * whiteKeyWidth}px`;
                    key.style.width = `${whiteKeyWidth}px`;
                    key.style.height = '140px';
                    key.style.zIndex = '1';

                    if (isInScale) {
                        const dot = document.createElement('div');
                        dot.className = `w-2.5 h-2.5 rounded-full ${isActivePlay ? 'bg-white' : 'bg-blue-600 shadow-sm'}`;
                        key.appendChild(dot);
                    }

                    key.addEventListener('click', () => {
                        initAudio();
                        playTone(m);
                        key.classList.add('bg-blue-200');
                        setTimeout(() => key.classList.remove('bg-blue-200'), 250);
                    });

                    keyboardContainer.appendChild(key);
                    whiteIndex++;
                }
            }

            // 黒鍵描画
            whiteIndex = 0;
            for (let m = startMidi; m <= endMidi; m++) {
                const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
                if (!isBlack) {
                    whiteIndex++;
                } else {
                    const isInScale = activeNotes.includes(m);
                    const isActivePlay = (activeMidi === m);
                    const leftPos = (whiteIndex * whiteKeyWidth) - 14;

                    const key = document.createElement('div');
                    key.className = `absolute top-0 apple-key-black cursor-pointer transition-all duration-150 flex flex-col justify-end items-center pb-2 ${isActivePlay ? 'key-active !bg-blue-400' : isInScale ? '!bg-slate-700 ring-1 ring-blue-400/50' : ''}`;
                    key.style.left = `${leftPos}px`;
                    key.style.width = '28px';
                    key.style.height = '88px';
                    key.style.zIndex = '10';

                    if (isInScale) {
                        const dot = document.createElement('div');
                        dot.className = `w-1.5 h-1.5 rounded-full ${isActivePlay ? 'bg-white' : 'bg-blue-400 shadow'}`;
                        key.appendChild(dot);
                    }

                    key.addEventListener('click', (e) => {
                        e.stopPropagation();
                        initAudio();
                        playTone(m);
                        key.classList.add('bg-slate-500');
                        setTimeout(() => key.classList.remove('bg-slate-500'), 250);
                    });

                    keyboardContainer.appendChild(key);
                }
            }
        }

        function updateUI() {
            const scaleObj = scalesData.find(s => s.id === currentScaleId);
            activeTitle.textContent = scaleObj.name;
            scaleTypeTag.textContent = scaleObj.type === 'major' ? 'Major Scale' : 'Harmonic Minor';
            renderKeyboard(-1);
            initGrid();
        }

        function initGrid() {
            scaleGrid.innerHTML = '';
            scalesData.forEach(item => {
                const isSelected = item.id === currentScaleId;
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl transition cursor-pointer flex items-center justify-between border ${isSelected ? 'bg-blue-50/60 border-blue-500 shadow-sm' : 'glass-panel hover:border-gray-300'}`;
                card.innerHTML = `
                    <div>
                        <div class="text-xs font-semibold text-gray-900">${item.name}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${item.type === 'major' ? '長調' : '和声短音階'}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="event.stopPropagation(); playDirect('${item.id}')" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-blue-600 hover:text-white text-gray-700 flex items-center justify-center transition shadow-2xs">
                            <i data-lucide="play" class="w-3.5 h-3.5 fill-current ml-0.5"></i>
                        </button>
                    </div>
                `;
                card.addEventListener('click', () => {
                    currentScaleId = item.id;
                    updateUI();
                });
                scaleGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.playDirect = function(scaleId) {
            initAudio();
            currentScaleId = scaleId;
            updateUI();
            startPlay();
        };

        function startPlay() {
            initAudio();
            if (isPlaying) return;
            const scaleObj = scalesData.find(s => s.id === currentScaleId);
            const notes = scaleObj.offsets.map(offset => scaleObj.root + offset);

            isPlaying = true;
            btnPlay.classList.add('hidden');
            btnStop.classList.remove('hidden');

            let idx = 0;
            function step() {
                if (!isPlaying) return;
                if (idx < notes.length) {
                    playTone(notes[idx]);
                    renderKeyboard(notes[idx]);
                    idx++;
                    playTimeoutId = setTimeout(step, 320);
                } else {
                    stopPlay();
                }
            }
            step();
        }

        function stopPlay() {
            isPlaying = false;
            if (playTimeoutId) clearTimeout(playTimeoutId);
            btnPlay.classList.remove('hidden');
            btnStop.classList.add('hidden');
            renderKeyboard(-1);
        }

        btnPlay.addEventListener('click', startPlay);
        btnStop.addEventListener('click', stopPlay);

        // 初期化実行
        initGrid();
        updateUI();
    </script>
</body>
</html>
